<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>메뉴 한 번에 올리기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap admin">
  <h1>메뉴 한 번에 올리기</h1>
  <p>엑셀에서 표를 복사해 붙여넣거나 CSV 파일 내용을 붙여넣으세요. 첫 줄은 <code>카테고리,이름,영문명,가격,설명</code> 입니다. 사장님 화면이 내려 준 <code>menu-backup.js</code> 내용을 붙여넣으면 백업으로 되돌릴 수 있습니다.</p>
  <p class="msg" id="who">로그인 상태 확인 중…</p>
  <textarea id="src" rows="10" aria-label="붙여넣을 내용"></textarea>
  <div class="bar">
    <button class="btn" id="preview" type="button">미리 보기</button>
    <label class="check"><input type="checkbox" id="replace"> 지금 메뉴를 모두 지우고 올리기</label>
    <button class="btn btn-primary" id="upload" type="button" disabled>올리기</button>
  </div>
  <p class="msg" id="msg" role="status"></p>
  <div class="scroll"><table id="table"></table></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script src="/menu.js"></script>
<script>
const cfg = window.MENU_CONFIG || {};
const T = Menu.tables(cfg.TABLE_PREFIX);
const $ = id => document.getElementById(id);
const say = text => { $('msg').textContent = text; };
let db, isOwner = false, parsed = null;

async function start() {
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || Menu.isSecretKey(cfg.SUPABASE_ANON_KEY) || !window.supabase) {
    $('who').textContent = 'config.js에 공개 키가 들어 있어야 합니다. (PART 2)'; return;
  }
  db = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  const { data: { user } } = await db.auth.getUser();
  const rows = user ? (await db.from(T.owners).select('user_id').eq('user_id', user.id)).data || [] : [];
  isOwner = rows.length > 0;
  $('who').textContent = isOwner ? '사장님 계정으로 로그인되어 있습니다.' : '같은 주소의 사장님 화면(admin)에서 먼저 로그인하세요.';
}

function showTable(p) {
  const table = $('table'); table.replaceChildren();
  const head = table.createTHead().insertRow();
  for (const h of ['카테고리', '이름', '영문명', '가격', '설명']) head.append(Object.assign(document.createElement('th'), { textContent: h }));
  const body = table.createTBody();
  for (const it of p.items) {
    const tr = body.insertRow();
    for (const v of [it.category, it.name, it.name_en || '', Menu.formatPrice(it.price), it.description || '']) tr.insertCell().textContent = v;
  }
}

$('preview').addEventListener('click', () => {
  try { parsed = Menu.importFromText($('src').value); }
  catch (e) { parsed = { categories: [], items: [], errors: [e.message] }; }
  showTable(parsed);
  say(parsed.errors.length ? parsed.errors.join(' / ') : `${parsed.items.length}개 메뉴를 읽었습니다. 확인 후 올리기를 누르세요.`);
  $('upload').disabled = !isOwner || parsed.errors.length > 0 || parsed.items.length === 0;
});

$('upload').addEventListener('click', async () => {
  const fail = error => say('올리지 못했습니다: ' + error.message);
  if ($('replace').checked) {
    if (!confirm('지금 DB에 있는 메뉴와 종류를 모두 지우고 붙여넣은 내용으로 바꿉니다. 계속할까요?')) return;
    const del = await db.from(T.categories).delete().gte('id', 0);
    if (del.error) return fail(del.error);
  }
  const { data: existing, error: e1 } = await db.from(T.categories).select('*');
  if (e1) return fail(e1);
  const ids = new Map(existing.map(c => [c.name, c.id]));
  const missing = parsed.categories.filter(c => !ids.has(c.name)).map(c => ({ ...c, sort: existing.length + c.sort }));
  if (missing.length) {
    const { data: added, error } = await db.from(T.categories).insert(missing).select();
    if (error) return fail(error);
    added.forEach(c => ids.set(c.name, c.id));
  }
  const rows = parsed.items.map(({ category, ...it }) => ({ ...it, category_id: ids.get(category) }));
  const { error: e2 } = await db.from(T.items).insert(rows);
  if (e2) return fail(e2);
  say(`${rows.length}개 메뉴를 올렸습니다. 손님 화면을 새로 고쳐 확인하세요.`);
  $('upload').disabled = true;
});

start();
</script>
</body>
</html>
